<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ANG HR 臨時支援打卡</title><script src="./config.js"></script><style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dfe4ec;--text:#101828;--muted:#667085;--main:#ff7a21;--ok:#047857;--err:#b42318}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}.wrap{max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 15px 38px rgba(16,24,40,.08)}h1{margin:0 0 6px;font-size:25px}h2{font-size:17px}.hint{font-size:13px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}@media(max-width:680px){.grid{grid-template-columns:1fr}}label{display:block;font-size:12px;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #cfd5df;border-radius:13px;padding:10px 12px;font-size:14px}input,select{height:44px}textarea{min-height:78px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:14px;padding:12px 14px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(135deg,#ff8a2a,#ff6415);color:#fff}.soft{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}.ghost{background:#fff;color:#344054;border:1px solid var(--line)}.danger{background:#fef2f2;color:#b42318;border:1px solid #fecaca}.status{margin-top:13px;border:1px solid var(--line);border-radius:15px;padding:11px;background:#f8fafc;white-space:pre-wrap;font-size:13px}.status.ok{background:#ecfdf3;border-color:#a7f3d0;color:var(--ok)}.status.err{background:#fef2f2;border-color:#fecaca;color:var(--err)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left}th{background:#f8fafc}.toplinks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}html[data-display-mode="lite"] .card{box-shadow:none}
</style><link rel="stylesheet" href="./display-mode.css"></head><body><main class="wrap"><div class="toplinks"><button class="ghost" onclick="location.href='./nfc_admin.html'+location.search">打卡點設定</button><button class="ghost" onclick="location.href='./app.html?view=admin'">返回管理端</button></div>
<section class="card"><h1>臨時支援打卡</h1><div class="hint">指派員工在指定期間可使用另一個地點打卡。到期後自動失效，不需改掉員工原分店資料。</div><div class="grid">
<div><label>公司代碼</label><input id="companyId"></div><div><label>管理者員編</label><input id="adminId"></div><div><label>登入 Token</label><input id="token" type="password"></div><div><label>支援員工編號</label><input id="targetId" placeholder="ANG0602"></div>
<div><label>原分店 ID</label><input id="homeBranch"></div><div><label>支援分店 ID</label><input id="supportBranch"></div><div><label>支援地點名稱</label><input id="locationName" placeholder="台中店正門"></div><div><label>允許半徑（公尺）</label><input id="radius" type="number" min="10" max="5000" value="200"></div>
<div><label>緯度</label><input id="latitude" inputmode="decimal"></div><div><label>經度</label><input id="longitude" inputmode="decimal"></div><div><label>開始時間</label><input id="validFrom" type="datetime-local"></div><div><label>結束時間</label><input id="validUntil" type="datetime-local"></div>
<div><label>支援期間仍可在原店打卡</label><select id="allowHome"><option value="true">可以</option><option value="false">不可以</option></select></div><div><label>備註</label><textarea id="note" placeholder="支援原因、班別或聯絡人"></textarea></div></div>
<div class="actions"><button class="soft" id="locationBtn">使用目前位置</button><button class="primary" id="saveBtn">建立支援指派</button><button class="ghost" id="reloadBtn">重新讀取</button></div><div id="status" class="status">準備中…</div></section>
<section class="card"><h2>支援指派清單</h2><div class="tablewrap" id="list">尚未讀取</div></section></main>
<script>(function(){'use strict';const CFG=window.ANG_HR_CONFIG||{},qs=new URLSearchParams(location.search),$=id=>document.getElementById(id),gas=qs.get('gas')||CFG.apiBaseUrl||CFG.gasApiUrl||'';$('companyId').value=(qs.get('company_id')||localStorage.getItem('ang_company_id')||'ANG_HR').toUpperCase();$('adminId').value=(qs.get('id')||localStorage.getItem('ang_login_id')||'').toUpperCase();$('token').value=qs.get('token')||localStorage.getItem('ang_login_token')||'';const now=new Date(),later=new Date(now.getTime()+86400000),fmt=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('validFrom').value=fmt(now);$('validUntil').value=fmt(later);
$('locationBtn').onclick=async()=>{try{st('正在取得位置…');const p=await loc();$('latitude').value=p.latitude;$('longitude').value=p.longitude;st('已帶入目前座標，精準度約 '+Math.round(p.accuracy)+' 公尺。','ok')}catch(e){err(e)}};$('saveBtn').onclick=save;$('reloadBtn').onclick=load;
function identity(){const p={company_id:$('companyId').value.trim().toUpperCase(),id:$('adminId').value.trim().toUpperCase(),employee_id:$('adminId').value.trim().toUpperCase(),token:$('token').value.trim(),loginToken:$('token').value.trim(),device_id:device()};localStorage.setItem('ang_company_id',p.company_id);localStorage.setItem('ang_login_id',p.id);if(p.token)localStorage.setItem('ang_login_token',p.token);return p}async function call(payload){if(!gas)throw new Error('尚未設定 GAS API 網址');const r=await fetch(gas,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign(identity(),payload))}),text=await r.text();let data;try{data=JSON.parse(text)}catch(e){throw new Error('後端回應格式錯誤：'+text.slice(0,120))}if(!data.ok)throw new Error(data.message||'操作失敗');return data}
async function save(){try{st('正在建立支援指派…');const data=await call({action:'createSupportAssignment',target_employee_id:$('targetId').value.trim().toUpperCase(),home_branch_id:$('homeBranch').value.trim().toUpperCase(),support_branch_id:$('supportBranch').value.trim().toUpperCase(),support_location_name:$('locationName').value.trim(),latitude:Number($('latitude').value),longitude:Number($('longitude').value),radius_meters:Number($('radius').value||200),valid_from:new Date($('validFrom').value).toISOString(),valid_until:new Date($('validUntil').value).toISOString(),allow_home_branch_clock:$('allowHome').value,note:$('note').value.trim(),created_by:$('adminId').value.trim().toUpperCase()});ok(data);load()}catch(e){err(e)}}
async function load(){try{const data=await call({action:'listSupportAssignments',list_all:true});const rows=data.assignments||[];$('list').innerHTML=rows.length?'<table><thead><tr><th>員工</th><th>支援地點</th><th>期間</th><th>半徑</th><th>狀態</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.employee_id)+'</td><td>'+esc((x.support_branch_id||'')+' '+(x.support_location_name||''))+'</td><td>'+esc(x.valid_from)+'<br>'+esc(x.valid_until)+'</td><td>'+esc(x.radius_meters)+'m</td><td>'+esc(x.status)+'</td><td>'+(String(x.status)!=='cancelled'?'<button class="danger" data-cancel="'+esc(x.support_assignment_id)+'">取消</button>':'')+'</td></tr>').join('')+'</tbody></table>':'目前沒有支援指派';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel));st('已讀取 '+rows.length+' 筆支援指派。','ok')}catch(e){err(e)}}
async function cancel(id){if(!confirm('確定取消這筆支援指派？'))return;try{ok(await call({action:'cancelSupportAssignment',support_assignment_id:id}));load()}catch(e){err(e)}}function loc(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('此裝置不支援定位'));navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>reject(new Error('無法取得定位，請確認權限與 GPS')),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})})}function device(){try{if(window.ANGHRApp&&ANGHRApp.getDeviceId)return String(ANGHRApp.getDeviceId()||'')}catch(e){}return localStorage.getItem('ang_device_id')||''}function ok(d){st(d.message||'完成','ok')}function err(e){st(e.message||String(e),'err')}function st(s,t){$('status').textContent=s;$('status').className='status'+(t?' '+t:'')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();})();</script><script src="./display-mode.js" defer></script></body></html>
