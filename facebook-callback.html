<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08184f" />
  <title>ANG HR｜Facebook 登入</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f8fc; --card:#fff; --text:#182033; --muted:#667085; --line:#d9e0ec; --accent:#1877f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#071126; --card:#0d1a36; --text:#f3f6ff; --muted:#aab4cb; --line:#263759; --accent:#6da8ff; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(560px,100%); padding:36px; border:1px solid var(--line); border-radius:22px; background:var(--card); box-shadow:0 18px 50px rgba(18,36,74,.12); text-align:center; }
    h1 { margin:0 0 14px; font-size:clamp(26px,6vw,38px); }
    p { color:var(--muted); line-height:1.7; }
    a { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>正在完成 Facebook 登入</h1>
    <p id="status" role="status" aria-live="polite">請稍候，正在安全驗證授權結果。</p>
    <p><a href="./">返回 ANG HR</a></p>
  </main>
  <script src="./config.js?v=20260805-facebook-login-v1"></script>
  <script>
    (async function () {
      'use strict';
      var status = document.getElementById('status');
      var params = new URLSearchParams(location.search);
      var state = params.get('state') || '';
      var expected = sessionStorage.getItem('ang_facebook_oauth_state') || '';
      sessionStorage.removeItem('ang_facebook_oauth_state');

      if (params.get('error')) {
        status.textContent = '登入未完成：' + (params.get('error_description') || params.get('error'));
        return;
      }
      if (!state || !expected || state !== expected) {
        status.textContent = '登入驗證失敗：安全狀態不一致，請返回 ANG HR 重新登入。';
        return;
      }

      var code = params.get('code');
      var settings = window.ANG_HR_CONFIG || {};
      if (!code) {
        status.textContent = 'Facebook 未回傳授權碼，請返回 ANG HR 重試。';
        return;
      }
      if (!settings.facebookTokenExchangeUrl) {
        status.textContent = 'Facebook 後端交換端點尚未設定。';
        return;
      }

      try {
        var response = await fetch(settings.facebookTokenExchangeUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'omit',
          body: JSON.stringify({
            action: 'facebookOAuthExchange',
            code: code,
            redirect_uri: settings.facebookRedirectUri
          })
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var auth = await response.json();
        if (!auth || auth.ok !== true) throw new Error((auth && auth.message) || '後端驗證失敗');

        localStorage.setItem('ang_last_deep_link_auth_result', JSON.stringify(auth));
        status.textContent = '登入成功，正在返回 ANG HR。';
        location.replace('./index.html');
      } catch (error) {
        status.textContent = '登入失敗：' + error.message;
      }
    }());
  </script>
</body>
</html>
