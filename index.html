<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07120f" />
  <meta name="description" content="ANG HR 系統建構中" />
  <title>ANG HR｜建構中</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f4fff9;
      background:
        radial-gradient(circle at 50% 18%, rgba(54, 255, 174, .16), transparent 34%),
        radial-gradient(circle at 15% 85%, rgba(0, 177, 255, .10), transparent 28%),
        linear-gradient(145deg, #030806 0%, #07120f 48%, #020504 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    main {
      position: relative;
      width: min(88vw, 620px);
      padding: 48px 28px;
      text-align: center;
      border: 1px solid rgba(107, 255, 189, .28);
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(17, 36, 29, .76), rgba(3, 10, 7, .58));
      box-shadow:
        0 24px 80px rgba(0, 0, 0, .45),
        inset 0 1px 0 rgba(255, 255, 255, .08),
        0 0 38px rgba(55, 255, 173, .08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      color: #00150c;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #b7ffdb, #35ee9e 58%, #00a966);
      box-shadow: 0 0 34px rgba(53, 238, 158, .32);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #72ffc0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 9vw, 58px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    p {
      margin: 18px auto 0;
      max-width: 430px;
      color: rgba(232, 255, 244, .72);
      font-size: 16px;
      line-height: 1.8;
    }

    .status {
      margin: 26px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      border: 1px solid rgba(114, 255, 192, .18);
      border-radius: 999px;
      color: #caffdf;
      background: rgba(61, 255, 164, .07);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #54ffa9;
      box-shadow: 0 0 12px #54ffa9;
      animation: pulse 1.8s ease-in-out infinite;
    }

    footer {
      margin-top: 30px;
      color: rgba(220, 255, 237, .38);
      font-size: 12px;
      letter-spacing: .08em;
    }

    @keyframes pulse {
      0%, 100% { opacity: .35; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @media (max-width: 480px) {
      main { padding: 40px 22px; border-radius: 24px; }
      p { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ANG</div>
    <div class="eyebrow">ANG HR SYSTEM</div>
    <h1>系統建構中</h1>
    <p>我們正在整理與升級 ANG HR，正式服務即將重新開放。感謝你的耐心等候。</p>
    <div class="status"><span class="dot"></span>系統升級進行中</div>
    <footer>© 2026 ANG HR</footer>
  </main>

  <script>
    (async function clearLegacyCache() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    }()).catch(console.warn);
  </script>
</body>
</html>
